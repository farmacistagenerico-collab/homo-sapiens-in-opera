name: Build and Deploy Homo Sapiens in Opera

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Evita deploy sovrapposti: una build alla volta
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository (contenuti)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Quartz v4 NON è distribuito come pacchetto npm.
      # Lo cloniamo come "engine" di build, nello stesso modo documentato
      # dalla guida ufficiale (https://quartz.jzhao.xyz/).
      - name: Checkout Quartz v4 engine
        uses: actions/checkout@v4
        with:
          repository: jackyzha0/quartz
          ref: v4
          path: quartz-engine
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Verify Node and npm versions
        run: |
          node -v
          npm -v

      - name: Ensure npm >= 10.9.2
        run: |
          corepack enable
          corepack prepare npm@10.9.2 --activate
          npm -v

      - name: Install Quartz engine dependencies
        working-directory: ./quartz-engine
        run: npm ci

      # Porta la configurazione dentro l'engine.
      # L'engine si aspetta quartz.config.ts nella sua root.
      - name: Copy quartz.config.ts into engine
        run: cp -f quartz.config.ts quartz-engine/quartz.config.ts

      # Tutti i .md del repo diventano il "content/" dell'engine.
      # Escludiamo i file di build/config che non sono contenuti.
      - name: Mirror content into engine
        run: |
          mkdir -p quartz-engine/content
          rsync -av \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='quartz-engine' \
            --exclude='.gitignore' \
            --exclude='quartz.config.ts' \
            --exclude='package.json' \
            --exclude='package-lock.json' \
            --exclude='tsconfig.json' \
            --exclude='netlify.toml' \
            --exclude='README.md' \
            ./ quartz-engine/content/

      - name: Build site with Quartz
        working-directory: ./quartz-engine
        run: npx quartz build

      - name: Verify build output exists
        working-directory: ./quartz-engine
        run: |
          if [ ! -d public ] || [ -z "$(ls -A public 2>/dev/null)" ]; then
            echo "::error::Build output (public/) is missing or empty"
            exit 1
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./quartz-engine/public

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
