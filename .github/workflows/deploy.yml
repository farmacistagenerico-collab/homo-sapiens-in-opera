name: Build and Deploy Homo Sapiens in Opera

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository (contenuto)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout Quartz v4 (motore di build)
        uses: actions/checkout@v4
        with:
          repository: jackyzha0/quartz
          ref: v4
          path: quartz-engine
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: quartz-engine/package-lock.json

      - name: Install Quartz dependencies
        working-directory: ./quartz-engine
        run: npm ci

      - name: Copy quartz.config.ts into engine
        run: cp quartz.config.ts quartz-engine/quartz.config.ts

      - name: Copy content into Quartz
        run: |
          rsync -av \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='quartz-engine' \
            --exclude='quartz.config.ts' \
            --exclude='netlify.toml' \
            --exclude='*.json' \
            --exclude='*.toml' \
            . quartz-engine/content/

      - name: Build site with Quartz
        working-directory: ./quartz-engine
        run: npx quartz build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./quartz-engine/public

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4